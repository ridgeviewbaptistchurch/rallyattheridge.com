<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Admin - All Registrations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/admin/auth.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/admin/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 980px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">All Registrations</h1>
    <a href="/admin/" class="btn btn-sm btn-outline-secondary">← Back</a>
  </div>

  <div id="status" class="mb-3 text-muted small"></div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0" id="tbl">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Vehicle</th>
            <th>Color</th>
            <th>Class</th>
            <th>Checked In</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API_BASE = window.ADMIN_API_BASE || "https://api.rallyattheridge.org";
  const escapeHtml = (v) =>
    String(v ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

  const CLASS_LABEL = { car_truck: "Car/Truck", motorcycle: "Motorcycle", other: "Other" };

  async function load() {
    const res = await fetch(`${API_BASE}/api/admin/registrations`, { credentials: "include" });
    if (res.status === 401) { location.href = "/admin/login.html"; return; }

    const data = await res.json();
    const tbody = document.getElementById("tbody");

    if (!data.ok) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="alert alert-danger mb-0">${escapeHtml(data.error || "Error")}</div></td></tr>`;
      return;
    }

    const rows = data.registrations || [];
    document.getElementById("status").textContent = `${rows.length} registration${rows.length !== 1 ? "s" : ""}`;

    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No registrations yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(r => {
      const checked = !!r.checked_in_at;
      return `
        <tr class="${checked ? "table-success" : ""}">
          <td><a href="detail.html?car=${r.reg_number}">#${r.reg_number}</a></td>
          <td>${escapeHtml(r.name)}</td>
          <td>${escapeHtml(r.car_year)} ${escapeHtml(r.car_make)} ${escapeHtml(r.car_model)}</td>
          <td>${escapeHtml(r.car_color)}</td>
          <td>${escapeHtml(CLASS_LABEL[r.class] || r.class)}</td>
          <td>${checked ? '<span class="badge text-bg-success">Yes</span>' : '<span class="badge text-bg-secondary">No</span>'}</td>
        </tr>
      `;
    }).join("");
  }

  load();
</script>
</body>
</html>
