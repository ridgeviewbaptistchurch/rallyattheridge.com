<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Print</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://tracking.jclab.xyz/api/script.js" data-site-id="0428399473ef" defer></script>
</head>
<body>
<script>
  const API_BASE = "https://api.rallyattheridge.org";
  const params = new URLSearchParams(location.search);
  const car = params.get("car");

  if (!car) {
    document.body.innerHTML = "<p>No car number specified.</p>";
  } else {
    fetch(`${API_BASE}/api/admin/session`, { credentials: "include" }).then((res) => {
      if (res.status === 401) {
        const next = encodeURIComponent(window.location.pathname + window.location.search);
        location.href = `/admin/login.html?next=${next}`;
        return;
      }
      location.href = `${API_BASE}/api/admin/print/${encodeURIComponent(car)}`;
    });
  }
</script>
</body>
</html>
