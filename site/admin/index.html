<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Check In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 980px;">
  <h1 class="mb-3">Admin</h1>

  <div class="card card-body mb-3">
    <label class="form-label">Search (car #, name, phone, email, make/model)</label>
    <div class="d-flex gap-2">
      <input id="q" class="form-control" placeholder="e.g. 123 or Smith">
      <button id="btn" class="btn btn-primary">Search</button>
    </div>
  </div>

  <div id="results"></div>
</div>

<script>
  const API_BASE = "https://api.rallyattheridge.org";

  async function runSearch() {
    const q = document.getElementById("q").value.trim();
    const res = await fetch(`${API_BASE}/api/admin/search?q=${encodeURIComponent(q)}`, { credentials: "include" });
    const data = await res.json();
    const wrap = document.getElementById("results");

    if (!data.ok) {
      wrap.innerHTML = `<div class="alert alert-danger">${data.error || "Error"}</div>`;
      return;
    }

    const rows = data.results || [];
    if (!rows.length) {
      wrap.innerHTML = `<div class="alert alert-secondary">No results.</div>`;
      return;
    }

    wrap.innerHTML = `
      <div class="list-group">
        ${rows.map(r => {
          const cls = r.class === "car_truck" ? "Car/Truck" : (r.class === "motorcycle" ? "Motorcycle" : "Other");
          const checked = r.checked_in_at ? "Checked in" : "Not checked in";
          return `
            <a class="list-group-item list-group-item-action" href="detail.html?car=${r.reg_number}">
              <div class="d-flex justify-content-between">
                <div><strong>#${r.reg_number}</strong> ${r.name}</div>
                <div class="text-muted">${checked}</div>
              </div>
              <div class="text-muted">${r.car_year} ${r.car_make} ${r.car_model} (${r.car_color}) • ${cls}</div>
            </a>
          `;
        }).join("")}
      </div>
    `;
  }

  document.getElementById("btn").addEventListener("click", runSearch);
  document.getElementById("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });
</script>
</body>
</html>
