<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Check In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/admin/auth.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/admin/admin.css" rel="stylesheet">
  <script src="https://tracking.jclab.xyz/api/script.js" data-site-id="0428399473ef" defer></script>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 980px;">
  <h1 class="mb-3">Admin</h1>
  <nav class="mb-3">
    <div class="nav nav-pills">
      <a class="nav-link active" href="/admin/index.html">Search</a>
      <a class="nav-link" href="/admin/register.html">Register</a>
      <a class="nav-link" href="/admin/votes.html">Votes</a>
      <a class="nav-link" href="/admin/prizes.html">Drawings</a>
    </div>
  </nav>

  <div id="stats" class="row g-2 mb-3"></div>

  <div class="card card-body mb-3">
    <label class="form-label">Search (car #, name, phone, email, make/model)</label>
    <div class="d-flex gap-2">
      <input id="q" class="form-control" placeholder="e.g. 123 or Smith">
      <button id="btn" class="btn btn-primary">Search</button>
    </div>
  </div>

  <div id="results"></div>
</div>

<script>
  const API_BASE = window.ADMIN_API_BASE || "https://api.rallyattheridge.org";
  const escapeHtml = (v) =>
    String(v ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  const asNumber = (v, fallback = 0) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  };

  function statCard(label, value, tone = "primary") {
    return `
      <div class="col-12 col-md-4">
        <div class="card border-${tone}">
          <div class="card-body py-3">
            <div class="text-muted small">${label}</div>
            <div class="fs-3 fw-bold">${value}</div>
          </div>
        </div>
      </div>
    `;
  }

  async function loadStats() {
    const res = await fetch(`${API_BASE}/api/admin/stats`, { credentials: "include" });
    if (res.status === 401) {
      location.href = "/admin/login.html";
      return;
    }

    const data = await res.json();
    const wrap = document.getElementById("stats");

    if (!data.ok) {
      wrap.innerHTML = `<div class="col-12"><div class="alert alert-danger mb-0">${escapeHtml(data.error || "Error loading stats")}</div></div>`;
      return;
    }

    const s = data.stats || {};
    wrap.innerHTML = [
      statCard("Total Registrations", asNumber(s.total), "primary"),
      statCard("Checked In", asNumber(s.checked_in), "success"),
      statCard("Not Checked In", asNumber(s.not_checked_in), "secondary"),
    ].join("");
  }

  async function runSearch() {
    const q = document.getElementById("q").value.trim();
    
    const res = await fetch(
      `${API_BASE}/api/admin/search?q=${encodeURIComponent(q)}`,
      { credentials: "include" }
    );

    if (res.status === 401) {
      location.href = "/admin/login.html";
      return;
    }

    
    const data = await res.json();
    const wrap = document.getElementById("results");

    if (!data.ok) {
      wrap.innerHTML = `<div class="alert alert-danger">${escapeHtml(data.error || "Error")}</div>`;
      return;
    }

    const rows = data.results || [];
    if (!rows.length) {
      wrap.innerHTML = `<div class="alert alert-secondary">No results.</div>`;
      return;
    }

    wrap.innerHTML = `
      <div class="list-group">
        ${rows.map(r => {
          const cls = r.class === "car_truck" ? "Car/Truck" : (r.class === "motorcycle" ? "Motorcycle" : "Other");
          const checked = !!r.checked_in_at;
          const statusBadge = checked
            ? `<span class="badge text-bg-success">Checked In</span>`
            : `<span class="badge text-bg-secondary">Not Checked In</span>`;
          const itemClass = checked ? "list-group-item-success" : "";
          return `
            <a class="list-group-item list-group-item-action ${itemClass}" href="detail.html?car=${asNumber(r.reg_number)}">
              <div class="d-flex justify-content-between">
                <div><strong>#${asNumber(r.reg_number)}</strong> ${escapeHtml(r.name)}</div>
                <div>${statusBadge}</div>
              </div>
              <div class="text-muted">${escapeHtml(r.car_year)} ${escapeHtml(r.car_make)} ${escapeHtml(r.car_model)} (${escapeHtml(r.car_color)}) • ${cls}</div>
            </a>
          `;
        }).join("")}
      </div>
    `;
  }

  document.getElementById("btn").addEventListener("click", runSearch);
  document.getElementById("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });

  loadStats();
</script>
</body>
</html>
