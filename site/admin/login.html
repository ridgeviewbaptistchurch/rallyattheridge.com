<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 520px;">
  <h1 class="mb-3">Admin Login</h1>

  <form id="f" class="card card-body">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" name="username" autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input class="form-control" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Log In</button>
    <div id="msg" class="mt-3"></div>
  </form>
</div>

<script>
  const API_BASE = "https://api.rallyattheridge.org"; // set this
  const msg = document.getElementById("msg");
  const nextParam = new URLSearchParams(location.search).get("next") || "/admin/";
  const next = nextParam.startsWith("/") ? nextParam : "/admin/";

  fetch(`${API_BASE}/api/admin/session`, { credentials: "include" }).then((res) => {
    if (res.ok) location.href = next;
  });

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.innerHTML = "";

    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd.entries());

    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify(payload),
      credentials: "include"
    });

    const data = await res.json().catch(() => null);
    if (!res.ok || !data?.ok) {
      msg.innerHTML = `<div class="alert alert-danger">Login failed.</div>`;
      return;
    }

    location.href = next;
  });
</script>
</body>
</html>
