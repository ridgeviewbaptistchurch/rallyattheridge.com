<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Admin - Votes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/admin/auth.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/admin/admin.css" rel="stylesheet">
  <script src="https://tracking.jclab.xyz/api/script.js" data-site-id="0428399473ef" defer></script>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 720px;">
  <nav class="mb-3">
    <div class="nav nav-pills">
      <a class="nav-link" href="/admin/index.html">Search</a>
      <a class="nav-link" href="/admin/register.html">Register</a>
      <a class="nav-link active" href="/admin/votes.html">Votes</a>
      <a class="nav-link" href="/admin/prizes.html">Drawings</a>
    </div>
  </nav>
  <h1 class="mb-3">Enter Votes</h1>

  <div class="card card-body">
    <div class="mb-3">
      <label class="form-label">Car Numbers</label>
      <textarea id="regs" class="form-control form-control-lg" rows="3" placeholder="10 12 2 81"></textarea>
      <div class="form-text">Separate numbers with spaces, commas, or periods.</div>
    </div>
    <button id="submit" class="btn btn-primary btn-lg">Submit Votes</button>
  </div>

  <div id="msg" class="mt-3"></div>

  <div class="card card-body mt-4">
    <h2 class="h5 mb-3">Current Tally (Top 10 per Category)</h2>
    <div id="tally"></div>
  </div>
</div>

<script>
  const API_BASE = window.ADMIN_API_BASE || "https://api.rallyattheridge.org";
  const escapeHtml = (v) =>
    String(v ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  const asNumber = (v, fallback = 0) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  };
  const msg = document.getElementById("msg");
  const tallyWrap = document.getElementById("tally");

  function clsLabel(c) {
    if (c === "car_truck") return "Car/Truck";
    if (c === "motorcycle") return "Motorcycle";
    return "Other";
  }

  function parseRegNumbers(raw) {
    return raw
      .split(/[,\s.]+/)
      .map((s) => s.trim())
      .filter(Boolean);
  }

  async function loadTally() {
    const res = await fetch(`${API_BASE}/api/tally`, { credentials: "include" });
    if (res.status === 401) {
      location.href = "/admin/login.html";
      return;
    }

    const data = await res.json();
    if (!data.ok) {
      tallyWrap.innerHTML = `<div class="alert alert-danger mb-0">${escapeHtml(data.error || "Error loading tally")}</div>`;
      return;
    }

    const groups = { car_truck: [], motorcycle: [], other: [] };
    for (const row of data.rows || []) {
      if (!groups[row.class]) continue;
      groups[row.class].push(row);
    }

    const sections = ["car_truck", "motorcycle", "other"].map((cls) => {
      const rows = groups[cls];
      const topRows = rows.slice(0, 10);
      if (!rows.length) {
        return `
          <div class="mb-4">
            <h3 class="h6">${clsLabel(cls)}</h3>
            <div class="text-muted small">No votes yet.</div>
          </div>
        `;
      }

      return `
        <div class="mb-4">
          <h3 class="h6">${clsLabel(cls)}</h3>
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead>
                <tr>
                  <th>ID #</th>
                  <th>Name</th>
                  <th>Year</th>
                  <th>Make</th>
                  <th>Model</th>
                  <th>Color</th>
                  <th class="text-end">Votes</th>
                </tr>
              </thead>
              <tbody>
                ${topRows.map((r) => `
                  <tr>
                    <td>${asNumber(r.reg_number)}</td>
                    <td>${escapeHtml(r.name || "")}</td>
                    <td>${escapeHtml(r.car_year || "")}</td>
                    <td>${escapeHtml(r.car_make || "")}</td>
                    <td>${escapeHtml(r.car_model || "")}</td>
                    <td>${escapeHtml(r.car_color || "")}</td>
                    <td class="text-end"><strong>${asNumber(r.votes)}</strong></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          ${rows.length > 10 ? `<div class="text-muted small mt-2">Showing top 10 of ${rows.length}</div>` : ""}
        </div>
      `;
    });

    tallyWrap.innerHTML = sections.join("");
  }

  document.getElementById("submit").addEventListener("click", async () => {
    msg.innerHTML = "";
    const raw = document.getElementById("regs").value;
    const pieces = parseRegNumbers(raw);
    if (!pieces.length) {
      msg.innerHTML = `<div class="alert alert-danger">Enter at least one car number.</div>`;
      return;
    }

    const badTokens = pieces.filter((p) => !/^\d+$/.test(p));
    if (badTokens.length) {
      msg.innerHTML = `<div class="alert alert-danger">Invalid numbers: ${escapeHtml(badTokens.slice(0, 8).join(", "))}</div>`;
      return;
    }

    const regNumbers = pieces.map((p) => Number(p));

    const res = await fetch(`${API_BASE}/api/votes`, {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({ reg_numbers: regNumbers }),
      credentials: "include"
    });
    if (res.status === 401) {
      location.href = "/admin/login.html";
      return;
    }
    const data = await res.json();
    if (!data.ok) {
      msg.innerHTML = `<div class="alert alert-danger">${escapeHtml(data.error || "Error")}</div>`;
      return;
    }

    const invalid = data.invalid_reg_numbers || [];
    if (invalid.length) {
      const safeInvalid = invalid.map((n) => asNumber(n)).join(", ");
      msg.innerHTML = `
        <div class="alert alert-warning">
          Saved ${asNumber(data.inserted)} vote(s). These car numbers were not found: ${safeInvalid}
        </div>
      `;
    } else {
      msg.innerHTML = `<div class="alert alert-success">Saved ${asNumber(data.inserted)} vote(s).</div>`;
    }

    document.getElementById("regs").value = "";
    document.getElementById("regs").focus();
    loadTally();
  });

  loadTally();
</script>
</body>
</html>
