<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Votes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 720px;">
  <a href="/admin/" class="btn btn-link px-0">Back</a>
  <h1 class="mb-3">Enter Votes</h1>

  <div class="card card-body">
    <div class="mb-3">
      <label class="form-label">Category</label>
      <select id="cls" class="form-select">
        <option value="car_truck">Car/Truck</option>
        <option value="motorcycle">Motorcycle</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Car Number</label>
      <input id="reg" class="form-control form-control-lg" inputmode="numeric" placeholder="123">
    </div>
    <button id="submit" class="btn btn-primary btn-lg">Submit Vote</button>
  </div>

  <div id="msg" class="mt-3"></div>
</div>

<script>
  const API_BASE = "https://carshow-api.ridgeview.workers.dev/"; // change
  const msg = document.getElementById("msg");

  document.getElementById("submit").addEventListener("click", async () => {
    const payload = {
      class: document.getElementById("cls").value,
      reg_number: document.getElementById("reg").value.trim()
    };

    const res = await fetch(`${API_BASE}/api/votes`, {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) {
      msg.innerHTML = `<div class="alert alert-danger">${data.error || "Error"}</div>`;
      return;
    }
    msg.innerHTML = `<div class="alert alert-success">Vote recorded.</div>`;
    document.getElementById("reg").value = "";
    document.getElementById("reg").focus();
  });
</script>
</body>
</html>
