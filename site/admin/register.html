<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/admin/auth.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/admin/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 900px;">
  <nav class="mb-3">
    <div class="nav nav-pills">
      <a class="nav-link" href="/admin/index.html">Search</a>
      <a class="nav-link active" href="/admin/register.html">Register</a>
      <a class="nav-link" href="/admin/votes.html">Votes</a>
      <a class="nav-link" href="/admin/prizes.html">Drawings</a>
    </div>
  </nav>

  <h1 class="mb-3">Backend Registration</h1>

  <div class="alert alert-info">
    Submitting here auto-checks the vehicle in and opens the print sheet.
  </div>

  <form id="f" class="card card-body">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Phone</label>
        <input class="form-control" name="phone">
      </div>
      <div class="col-md-3">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" type="email">
      </div>
      <div class="col-md-6">
        <label class="form-label">Address</label>
        <input class="form-control" name="address" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Attended Before?</label>
        <select class="form-select" name="attended_before" required>
          <option value="">Select one</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">T-Shirt Size</label>
        <select class="form-select" name="tshirt_size" required>
          <option value="">Select size</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
          <option value="xl">XL</option>
          <option value="2xl">2XL</option>
          <option value="3xl">3XL</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Car Year</label>
        <input class="form-control" name="car_year" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Make</label>
        <input class="form-control" name="car_make" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Model</label>
        <input class="form-control" name="car_model" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Color</label>
        <input class="form-control" name="car_color" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Class</label>
        <select class="form-select" name="class" required>
          <option value="car_truck">Car/Truck</option>
          <option value="motorcycle">Motorcycle</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Do You Have a Home Church?</label>
        <select id="has_home_church" class="form-select" name="has_home_church" required>
          <option value="">Select one</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">If Yes, Where?</label>
        <input id="home_church_name" class="form-control" name="home_church_name" placeholder="Church name">
      </div>

      <div class="col-12">
        <button class="btn btn-primary" type="submit">Register + Check In</button>
      </div>
    </div>
  </form>

  <div id="msg" class="mt-3"></div>
</div>

<script>
  const API_BASE = window.ADMIN_API_BASE || "https://api.rallyattheridge.org";
  const escapeHtml = (v) =>
    String(v ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  const form = document.getElementById("f");
  const msg = document.getElementById("msg");
  const hasHomeChurchEl = document.getElementById("has_home_church");
  const homeChurchNameEl = document.getElementById("home_church_name");

  function syncHomeChurchRequired() {
    const yes = hasHomeChurchEl.value === "yes";
    homeChurchNameEl.required = yes;
    if (!yes) homeChurchNameEl.value = "";
  }

  hasHomeChurchEl.addEventListener("change", syncHomeChurchRequired);
  syncHomeChurchRequired();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.innerHTML = "";

    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());

    const res = await fetch(`${API_BASE}/api/admin/register`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
      credentials: "include"
    });

    if (res.status === 401) {
      location.href = "/admin/login.html";
      return;
    }

    const data = await res.json();
    if (!data.ok) {
      msg.innerHTML = `<div class="alert alert-danger">${escapeHtml(data.error || "Error")}</div>`;
      return;
    }

    location.href = `/admin/print.html?car=${encodeURIComponent(data.reg_number)}`;
  });
</script>
</body>
</html>
