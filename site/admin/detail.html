<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/admin/auth.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/admin/admin.css" rel="stylesheet">
  <script src="https://tracking.jclab.xyz/api/script.js" data-site-id="0428399473ef" defer></script>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 980px;">
  <nav class="mb-3">
    <div class="nav nav-pills">
      <a class="nav-link active" href="/admin/index.html">Search</a>
      <a class="nav-link" href="/admin/register.html">Register</a>
      <a class="nav-link" href="/admin/votes.html">Votes</a>
      <a class="nav-link" href="/admin/prizes.html">Drawings</a>
    </div>
  </nav>
  <h1 class="mb-3">Registration</h1>

  <div id="card"></div>
</div>

<script>
  const API_BASE = window.ADMIN_API_BASE || "https://api.rallyattheridge.org";
  const escapeHtml = (v) =>
    String(v ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  const asNumber = (v, fallback = 0) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  };
  const params = new URLSearchParams(location.search);
  const car = params.get("car");

  function clsLabel(c) {
    if (c === "car_truck") return "Car/Truck";
    if (c === "motorcycle") return "Motorcycle";
    return "Other";
  }

  async function load() {
    if (!car) {
      document.getElementById("card").innerHTML = `<div class="alert alert-danger">No registration number specified.</div>`;
      return;
    }
    const res = await fetch(`${API_BASE}/api/admin/registration/${encodeURIComponent(car)}`, { credentials: "include" });
    if (res.status === 401) {
      location.href = "/admin/login.html";
      return;
    }
    const data = await res.json();
    const wrap = document.getElementById("card");

    if (!data.ok) {
      wrap.innerHTML = `<div class="alert alert-danger">${escapeHtml(data.error || "Error")}</div>`;
      return;
    }
    const r = data.registration;
    const isCheckedIn = !!r.checked_in_at;
    const voteCount = asNumber(r.vote_count);
    const prizeWinCount = asNumber(r.prize_win_count);
    const wasPulledForPrize = prizeWinCount > 0;
    const attendedBefore = (r.attended_before || "").toLowerCase();
    const isFirstTime = attendedBefore === "no";
    const hasHomeChurch = (r.has_home_church || "").toLowerCase() === "yes";
    const statusBadge = isCheckedIn
      ? `<span class="badge text-bg-success">Checked In</span>`
      : `<span class="badge text-bg-secondary">Not Checked In</span>`;
    const prizeBadge = wasPulledForPrize
      ? `<span class="badge text-bg-warning">Yes</span>`
      : `<span class="badge text-bg-secondary">No</span>`;
    const prizeDetail = wasPulledForPrize
      ? `<div class="text-muted small mt-1">Latest prize: ${escapeHtml(r.latest_prize_name || "Prize")}${r.latest_prize_at ? ` (${escapeHtml(new Date(r.latest_prize_at).toLocaleString())})` : ""}</div>`
      : "";
    const firstTimeFlag = isFirstTime
      ? `
          <div class="alert alert-warning mt-3 mb-0">
            <strong>First Time Attendee</strong> - This person has not attended before.
          </div>
        `
      : "";
    const actions = isCheckedIn
      ? `
          <a class="btn btn-outline-secondary" href="/admin/print.html?car=${asNumber(r.reg_number)}" target="_blank">Print Sheet</a>
        `
      : `
          <button id="checkin" class="btn btn-success">Check In</button>
        `;

    wrap.innerHTML = `
      <div class="card card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div class="display-6 mb-0"><strong>#${asNumber(r.reg_number)}</strong></div>
            <div class="fs-4">${escapeHtml(r.car_year)} ${escapeHtml(r.car_make)} ${escapeHtml(r.car_model)}</div>
            <div class="text-muted">Color: ${escapeHtml(r.car_color)} • Class: ${clsLabel(r.class)}</div>
          </div>
          <div class="text-end">
            <div class="text-muted">Status:</div>
            <div>${statusBadge}</div>
          </div>
        </div>

        <hr/>

        <div><strong>Registrant:</strong> ${escapeHtml(r.name)}</div>
        <div class="text-muted">${escapeHtml(r.phone || "")} ${r.email ? ("• " + escapeHtml(r.email)) : ""}</div>
        <div class="mt-2"><strong>Address:</strong> ${escapeHtml(r.address || "-")}</div>
        <div class="mt-2"><strong>Attended Before:</strong> ${attendedBefore === "yes" ? "Yes" : attendedBefore === "no" ? "No" : "-"}</div>
        <div class="mt-2"><strong>T-Shirt Size:</strong> ${escapeHtml((r.tshirt_size || "").toUpperCase() || "-")}</div>
        <div class="mt-2"><strong>Home Church:</strong> ${hasHomeChurch ? escapeHtml(r.home_church_name || "Yes") : "No"}</div>

        ${firstTimeFlag}

        <div class="mt-3">
          <div><strong>Total Votes:</strong> ${voteCount}</div>
          <div><strong>Pulled For Prize:</strong> ${prizeBadge}</div>
          ${prizeDetail}
        </div>

        <div class="mt-3 d-flex gap-2 flex-wrap">
          ${actions}
        </div>
      </div>
    `;

    if (!isCheckedIn) {
      document.getElementById("checkin").addEventListener("click", async () => {
        const r2 = await fetch(`${API_BASE}/api/admin/registration/${encodeURIComponent(car)}/checkin`, {
          method: "POST",
          credentials: "include"
        });
        if (r2.status === 401) {
          location.href = "/admin/login.html";
          return;
        }
        const d2 = await r2.json();
        if (!d2.ok) alert(String(d2.error || "Error"));
        else load();
      });
    }
  }

  load();
</script>
</body>
</html>
