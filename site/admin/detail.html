<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/admin/auth.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 980px;">
  <a href="/admin/" class="btn btn-link px-0">Back</a>
  <h1 class="mb-3">Registration</h1>

  <div id="card"></div>
</div>

<script>
  const API_BASE = window.ADMIN_API_BASE || "https://api.rallyattheridge.org";
  const params = new URLSearchParams(location.search);
  const car = params.get("car");

  function clsLabel(c) {
    if (c === "car_truck") return "Car/Truck";
    if (c === "motorcycle") return "Motorcycle";
    return "Other";
  }

  async function load() {
    const res = await fetch(`${API_BASE}/api/admin/registration/${encodeURIComponent(car)}`, { credentials: "include" });
    if (res.status === 401) {
      location.href = "/admin/login.html";
      return;
    }
    const data = await res.json();
    const wrap = document.getElementById("card");

    if (!data.ok) {
      wrap.innerHTML = `<div class="alert alert-danger">${data.error || "Error"}</div>`;
      return;
    }
    const r = data.registration;
    const isCheckedIn = !!r.checked_in_at;
    const statusBadge = isCheckedIn
      ? `<span class="badge text-bg-success">Checked In</span>`
      : `<span class="badge text-bg-secondary">Not Checked In</span>`;
    const actions = isCheckedIn
      ? `
          <a class="btn btn-outline-secondary" href="/admin/print.html?car=${r.reg_number}" target="_blank">Print Sheet</a>
        `
      : `
          <button id="checkin" class="btn btn-success">Check In</button>
        `;

    wrap.innerHTML = `
      <div class="card card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div class="display-6 mb-0"><strong>#${r.reg_number}</strong></div>
            <div class="fs-4">${r.car_year} ${r.car_make} ${r.car_model}</div>
            <div class="text-muted">Color: ${r.car_color} • Class: ${clsLabel(r.class)}</div>
          </div>
          <div class="text-end">
            <div class="text-muted">Status:</div>
            <div>${statusBadge}</div>
          </div>
        </div>

        <hr/>

        <div><strong>Registrant:</strong> ${r.name}</div>
        <div class="text-muted">${r.phone || ""} ${r.email ? ("• " + r.email) : ""}</div>

        <div class="mt-3 d-flex gap-2 flex-wrap">
          ${actions}
        </div>
      </div>
    `;

    if (!isCheckedIn) {
      document.getElementById("checkin").addEventListener("click", async () => {
        const r2 = await fetch(`${API_BASE}/api/admin/registration/${encodeURIComponent(car)}/checkin`, {
          method: "POST",
          credentials: "include"
        });
        if (r2.status === 401) {
          location.href = "/admin/login.html";
          return;
        }
        const d2 = await r2.json();
        if (!d2.ok) alert(d2.error || "Error");
        else load();
      });
    }
  }

  load();
</script>
</body>
</html>
