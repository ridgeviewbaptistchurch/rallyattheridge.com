<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Car Show Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 860px;">
  <h1 class="mb-3">Car Show Registration</h1>

  <div class="alert alert-info">
    Fill this out once per vehicle. You’ll get your car number after submitting.
  </div>

  <form id="f" class="card card-body">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Phone</label>
        <input class="form-control" name="phone">
      </div>
      <div class="col-md-3">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" type="email">
      </div>

      <div class="col-md-3">
        <label class="form-label">Car Year</label>
        <input class="form-control" name="car_year" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Make</label>
        <input class="form-control" name="car_make" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Model</label>
        <input class="form-control" name="car_model" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Color</label>
        <input class="form-control" name="car_color" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Class</label>
        <select class="form-select" name="class" required>
          <option value="car_truck">Car/Truck</option>
          <option value="motorcycle">Motorcycle</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="col-12">
        <button class="btn btn-primary" type="submit">Submit Registration</button>
      </div>
    </div>
  </form>

  <div id="result" class="mt-3"></div>
</div>

<script>
  const API_BASE = "https://api.rallyattheridge.org";

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd.entries());

    const res = await fetch(`${API_BASE}/api/register`, {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    const el = document.getElementById("result");
    if (!data.ok) {
      el.innerHTML = `<div class="alert alert-danger">${data.error || "Error"}</div>`;
      return;
    }

    el.innerHTML = `
      <div class="alert alert-success">
        You are registered for the show!. Your car number is <strong>#${data.reg_number}</strong>.
      </div>
    `;
    e.target.reset();
  });
</script>
</body>
</html>
