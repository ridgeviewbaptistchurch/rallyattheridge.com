<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rally at the Ridge Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vehicle registration for Rally at the Ridge.">
  <style>
    :root {
      --bg-overlay: rgba(8, 12, 20, 0.62);
      --card-bg: rgba(14, 20, 33, 0.8);
      --panel-bg: rgba(255, 255, 255, 0.06);
      --text: #f7f8fb;
      --muted: #d6deea;
      --accent: #ffb100;
      --accent-hover: #ffc142;
      --danger: #ff8e8e;
      --success: #86efac;
      --maxw: 980px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: #0e1320;
    }

    body {
      min-height: 100vh;
      position: relative;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url("../RATR2024-DroneShot.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .panel {
      width: min(100%, var(--maxw));
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: clamp(20px, 4vw, 36px);
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .home-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .home-link:hover { color: var(--text); }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
    }

    .info {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
    }

    form {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 16px;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(12, minmax(0, 1fr));
    }

    .col-12 { grid-column: span 12; }
    .col-6 { grid-column: span 6; }
    .col-4 { grid-column: span 4; }
    .col-3 { grid-column: span 3; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(8, 12, 20, 0.65);
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 177, 0, 0.18);
    }

    .btn {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 22px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      background: var(--accent);
      color: #1d1300;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    #result {
      margin-top: 14px;
    }

    .alert {
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid transparent;
    }

    .alert-danger {
      border-color: rgba(255, 142, 142, 0.35);
      color: #ffd2d2;
      background: rgba(102, 24, 24, 0.4);
    }

    .alert-success {
      border-color: rgba(134, 239, 172, 0.35);
      color: #dcffe7;
      background: rgba(20, 79, 42, 0.4);
    }

    @media (max-width: 900px) {
      .col-6, .col-4, .col-3 { grid-column: span 12; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="topline">
      <h1>Vehicle Registration</h1>
      <a class="home-link" href="/">Back to Home</a>
    </div>

    <p class="info">Fill this out once per vehicle. You will get your car number after submitting.</p>

    <form id="f">
      <div class="grid">
        <div class="col-6">
          <label for="name">Name</label>
          <input id="name" name="name" required>
        </div>
        <div class="col-3">
          <label for="phone">Phone</label>
          <input id="phone" name="phone">
        </div>
        <div class="col-3">
          <label for="email">Email</label>
          <input id="email" name="email" type="email">
        </div>

        <div class="col-3">
          <label for="car_year">Car Year</label>
          <input id="car_year" name="car_year" required>
        </div>
        <div class="col-3">
          <label for="car_make">Make</label>
          <input id="car_make" name="car_make" required>
        </div>
        <div class="col-3">
          <label for="car_model">Model</label>
          <input id="car_model" name="car_model" required>
        </div>
        <div class="col-3">
          <label for="car_color">Color</label>
          <input id="car_color" name="car_color" required>
        </div>

        <div class="col-4">
          <label for="class">Class</label>
          <select id="class" name="class" required>
            <option value="car_truck">Car/Truck</option>
            <option value="motorcycle">Motorcycle</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="col-12">
          <button class="btn" type="submit">Submit Registration</button>
        </div>
      </div>
    </form>

    <div id="result"></div>
  </main>

  <script>
    const API_BASE = "https://api.rallyattheridge.org";

    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());

      const res = await fetch(`${API_BASE}/api/register`, {
        method: "POST",
        headers: {"content-type": "application/json"},
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      const el = document.getElementById("result");
      if (!data.ok) {
        el.innerHTML = `<div class="alert alert-danger">${data.error || "Error"}</div>`;
        return;
      }

      el.innerHTML = `
        <div class="alert alert-success">
          You are registered for the show. Your car number is <strong>#${data.reg_number}</strong>.
        </div>
      `;
      e.target.reset();
    });
  </script>
</body>
</html>
