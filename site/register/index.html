<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Rally at the Ridge Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vehicle registration for Rally at the Ridge.">
  <style>
    :root {
      --bg-overlay: rgba(8, 12, 20, 0.62);
      --card-bg: rgba(14, 20, 33, 0.8);
      --panel-bg: rgba(255, 255, 255, 0.06);
      --text: #f7f8fb;
      --muted: #d6deea;
      --accent: #ffb100;
      --accent-hover: #ffc142;
      --danger: #ff8e8e;
      --success: #86efac;
      --maxw: 980px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: #0e1320;
    }

    body {
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url("../RATR2024-DroneShot.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: min(100%, var(--maxw));
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: clamp(20px, 4vw, 36px);
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .home-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .home-link:hover { color: var(--text); }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
    }

    .info {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
    }

    form {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 16px;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(12, minmax(0, 1fr));
    }

    .col-12 { grid-column: span 12; }
    .col-6 { grid-column: span 6; }
    .col-4 { grid-column: span 4; }
    .col-3 { grid-column: span 3; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(8, 12, 20, 0.65);
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 177, 0, 0.18);
    }

    .btn {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 22px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      background: var(--accent);
      color: #1d1300;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    #result {
      margin-top: 14px;
    }

    .success-screen {
      text-align: center;
      padding: 32px 16px;
    }

    .reg-number {
      display: inline-block;
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 900;
      color: var(--accent);
      background: rgba(255, 177, 0, 0.1);
      border: 2px solid rgba(255, 177, 0, 0.4);
      border-radius: 16px;
      padding: 12px 40px;
      margin: 16px 0;
      letter-spacing: 2px;
    }

    .success-screen h2 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--success);
    }

    .success-screen p {
      color: var(--muted);
      margin: 8px 0;
    }

    .register-another {
      margin-top: 24px;
      display: inline-block;
      border: 0;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 22px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      font: inherit;
      transition: background 0.15s ease;
    }

    .register-another:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .alert {
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid transparent;
    }

    .alert-danger {
      border-color: rgba(255, 142, 142, 0.35);
      color: #ffd2d2;
      background: rgba(102, 24, 24, 0.4);
    }

    .alert-success {
      border-color: rgba(134, 239, 172, 0.35);
      color: #dcffe7;
      background: rgba(20, 79, 42, 0.4);
    }

    @media (max-width: 900px) {
      .col-6, .col-4, .col-3 { grid-column: span 12; }
    }
  </style>
  <script src="https://tracking.jclab.xyz/api/script.js" data-site-id="0428399473ef" defer></script>
</head>
<body>
  <main class="panel">
    <div class="topline">
      <h1>Vehicle Registration</h1>
      <a class="home-link" href="/">Back to Home</a>
    </div>

    <p class="info">Fill this out once per vehicle. You will get your car number after submitting.</p>

    <form id="f">
      <div class="grid">
        <div class="col-6">
          <label for="name">Name</label>
          <input id="name" name="name" required>
        </div>
        <div class="col-3">
          <label for="phone">Phone</label>
          <input id="phone" name="phone">
        </div>
        <div class="col-3">
          <label for="email">Email</label>
          <input id="email" name="email" type="email">
        </div>
        <div class="col-6">
          <label for="address">Address</label>
          <input id="address" name="address" required>
        </div>
        <div class="col-3">
          <label for="attended_before">Attended Before?</label>
          <select id="attended_before" name="attended_before" required>
            <option value="">Select one</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <div class="col-3">
          <label for="tshirt_size">T-Shirt Size</label>
          <select id="tshirt_size" name="tshirt_size" required>
            <option value="">Select size</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
            <option value="xl">XL</option>
            <option value="2xl">2XL</option>
            <option value="3xl">3XL</option>
          </select>
        </div>

        <div class="col-3">
          <label for="car_year">Car Year</label>
          <input id="car_year" name="car_year" required>
        </div>
        <div class="col-3">
          <label for="car_make">Make</label>
          <input id="car_make" name="car_make" required>
        </div>
        <div class="col-3">
          <label for="car_model">Model</label>
          <input id="car_model" name="car_model" required>
        </div>
        <div class="col-3">
          <label for="car_color">Color</label>
          <input id="car_color" name="car_color" required>
        </div>

        <div class="col-4">
          <label for="class">Class</label>
          <select id="class" name="class" required>
            <option value="">Select class</option>
            <option value="car_truck">Car/Truck</option>
            <option value="motorcycle">Motorcycle</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="col-4">
          <label for="has_home_church">Do You Have a Home Church?</label>
          <select id="has_home_church" name="has_home_church" required>
            <option value="">Select one</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <div class="col-4">
          <label for="home_church_name">If Yes, Where?</label>
          <input id="home_church_name" name="home_church_name" placeholder="Church name">
        </div>

        <div class="col-12">
          <button class="btn" type="submit">Submit Registration</button>
        </div>
      </div>
    </form>

    <div id="result"></div>
  </main>

  <script>
    const API_BASE = "https://api.rallyattheridge.org";
    const escapeHtml = (v) =>
      String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    const hasHomeChurchEl = document.getElementById("has_home_church");
    const homeChurchNameEl = document.getElementById("home_church_name");

    function syncHomeChurchRequired() {
      const yes = hasHomeChurchEl.value === "yes";
      homeChurchNameEl.required = yes;
      if (!yes) homeChurchNameEl.value = "";
    }

    hasHomeChurchEl.addEventListener("change", syncHomeChurchRequired);
    syncHomeChurchRequired();

    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button[type=submit]");
      const el = document.getElementById("result");
      btn.disabled = true;
      btn.textContent = "Submitting…";
      let succeeded = false;

      try {
        const fd = new FormData(e.target);
        const payload = Object.fromEntries(fd.entries());

        const res = await fetch(`${API_BASE}/api/register`, {
          method: "POST",
          headers: {"content-type": "application/json"},
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!data.ok) {
          el.innerHTML = `<div class="alert alert-danger">${escapeHtml(data.error || "Registration failed. Please try again.")}</div>`;
          el.scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }

        succeeded = true;

        const emailVal = fd.get("email");
        const emailNote = emailVal
          ? `<p>A confirmation email has been sent to <strong>${escapeHtml(emailVal)}</strong>.</p>`
          : "";
        document.getElementById("f").style.display = "none";
        document.querySelector(".info").style.display = "none";
        el.innerHTML = `
          <div class="success-screen">
            <h2>You're Registered!</h2>
            <div class="reg-number">#${data.reg_number}</div>
            <p>This is your car number. Write it down or take a screenshot.</p>
            ${emailNote}
            <p>See you at the show!</p>
            <button class="register-another" onclick="location.href='/register/'">Register Another Vehicle</button>
          </div>
        `;
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (err) {
        el.innerHTML = `<div class="alert alert-danger">Something went wrong. Please check your connection and try again.</div>`;
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      } finally {
        if (!succeeded) {
          btn.disabled = false;
          btn.textContent = "Submit Registration";
        }
      }
    });
  </script>
</body>
</html>
